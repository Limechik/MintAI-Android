name: mintai
description: MintAI - AI client in Material 3 style.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  ffi: ^2.1.0
  audioplayers: ^6.1.0
  flutter_secure_storage: ">=9.2.4 <12.0.0"
  cryptography: ^2.7.0
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
